services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: research-agent-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: research-agent-backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - SQLITE_DB_PATH=/app/data/conversations.db
      - UPLOAD_DIR=/app/data/uploads
    env_file:
      - path: .env
        required: false
    volumes:
      - app_data:/app/data
    depends_on:
      - qdrant

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: research-agent-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  qdrant_storage:
  app_data: